<title id="t-hub">Median and typical range of private flood insurance premiums across 27 states</title><desc id="d-hub">Range plot. For each of 27 states a horizontal line spans the middle half of quotes (25th to 75th percentile) and a dot marks the median. Medians run from $369 in Michigan to $869 in Connecticut. Alabama has the widest typical range, $539 to $1,592.</desc>
