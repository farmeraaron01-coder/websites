<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 294" width="100%" height="auto" role="img" aria-labelledby="t-florida-flood-insurance-cost-by-zone d-florida-flood-insurance-cost-by-zone" style="max-width:720px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif">
<title id="t-florida-flood-insurance-cost-by-zone">Florida median annual private flood premium by FEMA flood zone</title>
<desc id="d-florida-flood-insurance-cost-by-zone">Horizontal bar chart. Zone AE $895 from 103 properties, Zone AH $824 from 13, Zone X $617 from 198, Zone A $562 from 24. Florida median across all zones is $681.</desc>
<text x="0" y="24" font-size="17" font-weight="700" fill="#12283f">Florida flood insurance cost by zone</text>
<text x="0" y="45" font-size="13" fill="#4a5a66">Median all-in annual premium, 342 properties quoted Feb 2025 – Aug 2026</text>
<text x="92" y="86.0" text-anchor="end" font-size="14" font-weight="600" fill="#12283f">Zone AE</text>
<rect x="104" y="64" width="498.1" height="34" rx="4" fill="#0A9B95"/>
<text x="612.1" y="82.0" font-size="14" font-weight="700" fill="#12283f">$895</text>
<text x="612.1" y="96.0" font-size="11.5" fill="#7f8d97">103 quoted</text>
<text x="92" y="134.0" text-anchor="end" font-size="14" font-weight="600" fill="#12283f">Zone AH</text>
<rect x="104" y="112" width="458.6" height="34" rx="4" fill="#0A9B95"/>
<text x="572.6" y="130.0" font-size="14" font-weight="700" fill="#12283f">$824</text>
<text x="572.6" y="144.0" font-size="11.5" fill="#7f8d97">13 quoted</text>
<text x="92" y="182.0" text-anchor="end" font-size="14" font-weight="600" fill="#12283f">Zone X</text>
<rect x="104" y="160" width="343.4" height="34" rx="4" fill="#0A9B95"/>
<text x="457.4" y="178.0" font-size="14" font-weight="700" fill="#12283f">$617</text>
<text x="457.4" y="192.0" font-size="11.5" fill="#7f8d97">198 quoted</text>
<text x="92" y="230.0" text-anchor="end" font-size="14" font-weight="600" fill="#12283f">Zone A</text>
<rect x="104" y="208" width="312.8" height="34" rx="4" fill="#0A9B95"/>
<text x="426.8" y="226.0" font-size="14" font-weight="700" fill="#12283f">$562</text>
<text x="426.8" y="240.0" font-size="11.5" fill="#7f8d97">24 quoted</text>
<line x1="104" y1="56" x2="104" y2="250" stroke="#dfe4e7" stroke-width="1"/>
<text x="0" y="278" font-size="11.5" fill="#7f8d97">Statewide Flood Insurance · one row per property · all-in = premium, policy fee and surplus lines taxes</text>
