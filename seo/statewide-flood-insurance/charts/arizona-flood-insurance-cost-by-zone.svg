<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 294" width="100%" height="auto" role="img" aria-labelledby="t-arizona-flood-insurance-cost-by-zone d-arizona-flood-insurance-cost-by-zone" style="max-width:720px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif">
<title id="t-arizona-flood-insurance-cost-by-zone">Arizona median annual private flood premium by FEMA flood zone</title>
<desc id="d-arizona-flood-insurance-cost-by-zone">Horizontal bar chart. Zone AE $581 from 107 properties, Zone X $568 from 32, Zone A $558 from 36, Zone AO $464 from 23. Arizona median across all zones is $547.</desc>
