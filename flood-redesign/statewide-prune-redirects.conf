# ---------------------------------------------------------------------------
# CALIFORNIA GEO PAGES — 7 rules. READ THIS BLOCK BEFORE INSTALLING.
#
# These are California city/region pages from when statewide covered California.
# The new statewide site is national and has no California page at all — California
# is now served by the sister site. So there are two defensible answers:
#
#   ACTIVE BELOW (safe default): same-domain 301 to /get-a-quote/. Keeps everything
#   on one domain, loses topical relevance.
#
#   RECOMMENDED (commented out): cross-domain 301 to californiafloodinsurance.com,
#   which is the better answer for a visitor searching for Sacramento or Long Beach
#   flood insurance, and passes most ranking signal to the site that should hold it.
#   Left commented because sending traffic between brands is a business decision,
#   not a technical one.
#
# Pick one. Do not enable both.
# ---------------------------------------------------------------------------
