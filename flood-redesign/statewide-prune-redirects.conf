# Statewide prune redirects — INSTALL NOW. Cutover already happened.
#
# HEADER CORRECTED 7 Aug 2026, after the flip. It previously read "install at
# cutover, not before" and said 50 URLs return 200 on the live site. Both were true
# when written and are now false: the docroot has been repointed,
# statewidefloodinsurance.com serves the new theme, and all 50 old paths already
# return 404 there. The loss this file exists to prevent is happening right now, so
# the timing advice is inverted — install immediately, do not hold these back.
#
# An agent re-validating this file correctly stopped and queried the contradiction
# rather than following a stale instruction. That was the right call, and the fix is
# this header, not the agent.
#
# Generated 7 Aug 2026 from a preflight.py run against the live Divi site. 50 URLs
# returned 200 on statewidefloodinsurance.com and 404 on the new theme, so each one
# loses its traffic and its accumulated ranking at the cutover unless handled here.
#
# VALIDATED BEFORE SHIPPING, because California's first draft of this file had ten
# dead rules and two that collided with new post slugs:
#   * all 50 missing URLs are covered exactly once — 0 uncovered, 0 duplicated
#   * 0 rules point at a URL that is not actually missing
#   * all 18 distinct 301 targets return 200 on the new site
#
# RE-VALIDATE BEFORE YOU INSTALL. If any new post or page has been added to the new
# site since this was generated, a source path here could collide with its slug and
# 301 away a live page. Check with:
#   for p in $(grep -oE '^Redirect (301|410) [^ ]+' this-file | awk '{print $3}'); do
#     curl -s -o /dev/null -w "%{http_code} $p\n" "https://staging.statewidefloodinsurance.com$p"
#   done
# Every one should be 404. Any 200 is a collision — remove that rule.
#
# WHERE THIS GOES: the .htaccess in the statewide docroot, ABOVE the
# "# BEGIN WordPress" block. These are mod_alias directives and fire before
# WordPress, so trashed posts and slug states are irrelevant to them.
#
# ORDER MATTERS: mod_alias matches prefixes, so a shorter path listed first can
# swallow a longer one. Kept alphabetical within each block, and no source here is
# a prefix of another — verified. The /how-much-does-flood-insurance-cost/ and
# /how-much-does-flood-insurance-cost-2/ pair is safe because the trailing slash
# stops the shorter one being a prefix of the longer.
#
# BUT PREFIX MATCHING IS NOT ONLY ABOUT COLLISIONS BETWEEN THESE RULES. `Redirect`
# also appends whatever follows the matched prefix, so `Redirect 301 /media/ /video/`
# would send /media/anything.pdf to /video/anything.pdf. Harmless for the long post
# slugs here, which have no children — but /media/ is a short, generic path that
# plausibly had some, so it is a `RedirectMatch` anchored with ^...$ instead. It is
# the only source path short enough for this to matter; every other one is a dated
# post slug.

