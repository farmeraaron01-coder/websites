Redirect 301 /master-flood-policies-hoas/ /homeowners-association-flood-insurance/
Redirect 301 /measure-your-damage-with-this-interactive-tool/ /flood-claim-guide/
# /media/ is anchored rather than a prefix match — see the header note. The plain
# `Redirect` form would also rewrite /media/<anything> to /video/<anything>.
RedirectMatch 301 ^/media/?$ /video/
