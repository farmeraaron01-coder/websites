# Statewide prune redirects — install at cutover, not before
#
# Generated 8 Aug 2026 from a preflight.py run against the live Divi site. 50 URLs
# return 200 on statewidefloodinsurance.com and 404 on the new theme, so each one
# loses its traffic and its accumulated ranking the moment DNS moves unless it is
# handled here.
#
# VALIDATED BEFORE SHIPPING, because California's first draft of this file had ten
# dead rules and two that collided with new post slugs:
#   * all 50 missing URLs are covered exactly once — 0 uncovered, 0 duplicated
#   * 0 rules point at a URL that is not actually missing
#   * all 18 distinct 301 targets return 200 on the new site
#
# RE-VALIDATE BEFORE YOU INSTALL. If any new post or page has been added to the new
# site since this was generated, a source path here could collide with its slug and
# 301 away a live page. Check with:
#   for p in $(grep -oE '^Redirect (301|410) [^ ]+' this-file | awk '{print $3}'); do
#     curl -s -o /dev/null -w "%{http_code} $p\n" "https://staging.statewidefloodinsurance.com$p"
#   done
# Every one should be 404. Any 200 is a collision — remove that rule.
#
# WHERE THIS GOES: the .htaccess in the statewide docroot, ABOVE the
# "# BEGIN WordPress" block. These are mod_alias directives and fire before
# WordPress, so trashed posts and slug states are irrelevant to them.
#
# ORDER MATTERS: mod_alias matches prefixes, so a shorter path listed first can
# swallow a longer one. Kept alphabetical within each block, and no source here is
# a prefix of another — verified.

# ---------------------------------------------------------------------------
