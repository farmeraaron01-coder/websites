# Statewide legacy post redirects — 48 URLs
#
# WHY THESE ARE REDIRECTS AND NOT MIGRATED CONTENT
# Statewide production serves 48 blog posts; the new install has 7. All 48 return
# 200 today and would 404 at cutover. Three rounds of investigation, prompted by
# Aaron asking whether thin non-performing posts belong on a new site at all:
#
#   1. Age. 35 were published 2011-2017, all bulk-touched the same day in Feb
#      2022. Three have misspelled slugs (fema-annouces, sandy-flood-vicitms,
#      excess-flood-insurance-commonplae). Two name events a decade past.
#   2. Depth. Median 261 words extracted from post_content; 32 of 48 under 400.
#      Checking the rendered pages rather than trusting the extraction put the
#      shortest at 117-135 words including boilerplate. Only one exceeds 1,000.
#   3. Portability. The rich 1,200-1,500 word versions exist only on California
#      and are written FOR California: 9-16 California references each, the
#      California Department of Insurance as the reader's regulator, a "full
#      California zone-by-zone breakdown", Central Valley levees and wildfire
#      burn-scar runoff, and the wrong brand name outright - "At California
#      Flood Insurance, we hold contracts with multiple Lloyd's...". Not a
#      find-and-replace; the substance is California.
#
# So there was nothing worth carrying over. Statewide's own copies are national
# but too thin to want; California's are substantial but wrong for the audience.
# The new site's 29 state pages (~800 words each) and 7 national articles are a
# genuine upgrade, and importing the legacy set would have diluted it.
#
# A 301 keeps whatever link equity 14 years accumulated, and keeps the visitor on
# the statewide brand rather than handing them to California mid-journey.
#
# Targets were verified to return 200 on the new install. /insights/ is the
# fallback for dated news items and California-local topics with no national
# equivalent - adjust any mapping that reads wrong to you; the file is the source
# of truth, not the reasoning above.

