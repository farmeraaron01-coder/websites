# California — close the directory listing that Google enumerated
#
# WHAT THIS FIXES, and how it was found. Aaron surfaced Search Console's Page
# indexing report on 10 Aug: 440 URLs under "Soft 404" and 89 under "Duplicate
# without user-selected canonical" on a site with 62 real pages. Exporting the
# URL lists settled it in one look — **not one of the 529 is a content page.**
# Every single one is under /wp-includes/ or /wp-content/themes/.
#
# The cause is that **californiafloodinsurance.com serves directory listings**
# and statewidefloodinsurance.com does not. Measured 10 Aug:
#
#   californiafloodinsurance.com/wp-includes/   200, 54,507 bytes, "Index of"
#   statewidefloodinsurance.com/wp-includes/    403
#
# Googlebot walked the tree from those listings and enumerated hundreds of core
# source files. Two sister sites on one cPanel account, one hardened and one not.
#
# EVERY EXPORTED URL, TESTED LIVE 10 Aug:
#
#   Soft 404 (440)   206 -> 404   /wp-content/themes/Divi/**.php — theme deleted.
#                                 ALREADY RESOLVED, waiting only on recrawl.
#                    214 -> 500   nested /wp-includes/**.php — fatal when loaded
#                                 outside WordPress.
#                     20 -> 200   top-level /wp-includes/*.php that return empty
#                                 instead of erroring. The literal soft 404s.
#   Duplicates (89)   40 -> 404   Divi again. Already resolved.
#                     49 -> 200   directory listings (confirmed "Index of") plus
#                                 readme.txt / license.txt. Near-identical pages
#                                 with no canonical — hence "duplicate".
#
# So 246 of 529 need nothing at all, and the rest are all one root cause.
#
# THIS IS NOT ONLY AN SEO PROBLEM. With listings on, anyone can browse the file
# tree of any directory that lacks its own index.php. Verified on California and
# not on statewide: /wp-content/themes/cfi-kadence-child/ and
# /wp-content/plugins/seo-by-rank-math/ are both browsable, and Rank Math's
# readme.txt returns "Stable tag: 1.0.275" — an exact plugin version, which is
# the first step of a targeted-exploit search. Fixing the SEO symptom and the
# disclosure is the same one-line change.
#
# ─────────────────────────────────────────────────────────────────────────────
# STEP 1 — DO THIS IN cPANEL, NOT IN A FILE. It is the whole fix for the 69 live
# URLs and it stops Google discovering more.
#
#   cPanel -> Advanced -> Indexes -> new.californiafloodinsurance.com -> No Indexing
#
# ⚠⚠ THE LIVE DOCROOT IS THE `new.`-NAMED FOLDER. NOT the one named after the
# domain. Verified in FLIP-LOG-CALIFORNIA.md lines 264-267:
#
#   /home/mrtaco5/new.californiafloodinsurance.com/   the LIVE production site
#   /home/mrtaco5/californiafloodinsurance.com/       the DEAD Divi install
#
# The rename that makes the names honest is scheduled for after the Divi
# retention month (~6 Sept) and has not happened yet, so the misleading state is
# current. cPanel's Indexes screen offers the domain-named folder first and it is
# the wrong one — selecting it succeeds, reports success, and changes nothing on
# the live site. **That is exactly what happened on the first attempt, 10 Aug.**
#
# It was proved to be the wrong folder rather than a cache problem by requesting
# directories that had certainly never been fetched before, with a random query
# string, and reading the cache header: `x-proxy-cache: MISS` with the listing
# still served. A MISS that still shows the old behaviour cannot be cache.
#
# This is the SECOND time the domain-named folder has misdirected a change on this
# account — the first was an .htaccess target on statewide, approved against a
# runbook step that said the same thing. **Read the path out of the flip log
# before touching any folder here, every time, including when it looks obvious.**
#
# Use the cPanel tool rather than pasting `Options -Indexes` by hand. cPanel
# writes the directive itself and reverses it in the same screen, and **a bare
# `Options` line in .htaccess returns HTTP 500 for the entire site if the server's
# AllowOverride does not permit it.** Statewide's behaviour suggests it is
# permitted here, but "suggests" is not a reason to risk the homepage when a
# supported toggle does the same job.
#
# Nothing legitimate needs a directory listing. There is no downside to this.
#
# VERIFY (I will run these):
#   /wp-includes/                              expect 403
#   /wp-content/themes/cfi-kadence-child/      expect 403
#   /wp-content/plugins/seo-by-rank-math/      expect 403
#   /                                          expect 200   <- confirm not 500
#   /get-a-quote/                              expect 200
#
# ─────────────────────────────────────────────────────────────────────────────
# STEP 2 — SEPARATE CHANGE, AFTER STEP 1 IS VERIFIED. Not urgent.
#
# Step 1 leaves 234 URLs Google already knows about returning 500 or empty-200.
# Neither is fatal, but a persistent 5xx across hundreds of URLs can hold down
# the crawl rate for the whole site, and crawl spent there is crawl not spent on
# the 62 pages that earn money. This converts them to a clean 404 so Google drops
# them instead of retrying for months.
#
# Paste into the docroot .htaccess ABOVE the `# BEGIN WordPress` block.
#
# WHY THE tinymce EXCEPTION IS FIRST AND MUST STAY: wp-tinymce.php is the one
# file under wp-includes that is genuinely fetched over HTTP — the classic editor
# loads its scripts through it. Verified returning 200 on California on 10 Aug.
# Block it along with the rest and the editor breaks, which is exactly the sort
# of "hardening" that gets discovered weeks later by someone trying to write a
# post. Every other .php there is include-only.
#
# Do step 1 and step 2 on separate days. If the site misbehaves, one change at a
# time is the difference between knowing why and guessing.

<IfModule mod_rewrite.c>
  RewriteEngine On

  # Allow — the classic editor fetches this over HTTP. Verified 200, 10 Aug.
  RewriteRule ^wp-includes/js/tinymce/wp-tinymce\.php$ - [L]

  # Deny everything else. 404 rather than 403 so Google de-indexes rather than
  # holding the URL as "forbidden" indefinitely.
  RewriteRule ^wp-includes/.+\.php$ - [R=404,L]
</IfModule>

# ─────────────────────────────────────────────────────────────────────────────
# STEP 3 — OPTIONAL, and safe on both sites. Stops the version disclosure.
#
# readme.txt and license.txt ship with WordPress and with most plugins and state
# their exact versions. Rank Math's is readable on California right now. Nothing
# on a live site reads these files, so denying them costs nothing.
#
# Root-level readme.html and license.txt name the WordPress version too.

<IfModule mod_authz_core.c>
  <FilesMatch "^(readme|README|license|LICENSE|changelog|CHANGELOG)\.(txt|html|md)$">
    Require all denied
  </FilesMatch>
</IfModule>

# ─────────────────────────────────────────────────────────────────────────────
# WHAT NOT TO DO, because it is the obvious wrong fix and it is tempting.
#
# **DO NOT add `Disallow: /wp-includes/` to robots.txt.** WordPress serves the
# block-library CSS and JS from /wp-includes/ (…/js/dist/…, …/css/dist/…), so
# blocking that path stops Google fetching assets it needs to render the pages,
# and a page Google cannot render is a page it cannot rank properly. It also
# would not remove anything already indexed — Disallow prevents crawling, not
# indexing, so the URLs can persist as bare results. The fix is at the HTTP
# layer, where the response itself changes.
#
# Also do not "fix" the three empty 200s at /wp-content/, /wp-content/plugins/
# and /wp-content/themes/. Those are WordPress's own blank index.php files doing
# their job — present on every WordPress site — and they are three URLs.
