# California — redirects for everything pruned before launch
#
# 48 URLs. The blog went from 59 posts to 14 in two passes on 5 Aug.
#
# Pass 1 removed 29 posts under 150 words, five of them under 25. Verified
# against production that these were always empty rather than lost in migration.
# Plus three unfilled placeholder pages whose visible text read "content
# migrates here from the live site".
#
# Pass 2 removed 16 more on an objective line that turned out to separate two
# generations of content perfectly, with nothing in between: every remaining post
# has 5-8 H2 headings and a meta description of 152-160 characters, while every
# removed one had zero headings and a description either missing or 287-377
# characters, which truncates in results.
#
# What is left: 14 posts, 598-1,490 words, median 1,354. Local topics redirect to
# the modern city pages rather than to articles, since those pages are the better
# destination for that intent.
#
# The posts are in Trash on the new install, not permanently deleted, so any of
# this is reversible from wp-admin until it is emptied. Full content is preserved
# in cfi_pruned_backup*.json alongside this project.
#
# Every target verified to return 200.

