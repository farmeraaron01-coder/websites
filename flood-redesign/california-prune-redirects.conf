# California — what happens to the 45 pruned URLs
#
# Two different treatments, because they are not the same case. Aaron asked why
# these were being redirected at all, and the honest answer is that a third of
# them should not be.
#
# WHY NOT JUST REDIRECT EVERYTHING
# Google treats a 301 to a page that is not a close equivalent as a soft 404. So
# pointing a 27-word 2012 news item at a 1,300-word evergreen article passes no
# equity, does not keep the URL indexed, and leaves a misleading hop behind. The
# "preserve link equity" argument is mostly fiction for content this thin.
#
# 301 REDIRECT — 26 URLs where a genuine replacement exists.
# The reason is the visitor, not the ranking: anyone arriving from an old link, an
# email, a directory listing, or a search result that has not refreshed yet lands
# on the page that actually answers their question. Local topics go to the modern
# city pages.
#
# 410 GONE — 22 URLs with no evergreen equivalent.
# Dated news items and one-off anecdotes: the 2013 hurricane season, a 2015 FEMA
# rate announcement, Hurricane Sandy, a valet parking story. Nothing on the site
# answers these because they were never questions. A 410 says "deliberately
# removed", which drops them from the index faster and more honestly than a
# redirect Google would discount anyway.
#
# Internal links were repaired at the source rather than relying on any of this:
# four pruned URLs were still linked from the FAQ page and three articles, and
# those now point at the surviving equivalents directly.

